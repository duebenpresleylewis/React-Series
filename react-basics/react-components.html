<!doctype html>
<html>
  <head>
    <title>React Basics</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      function ChatInput() {
        return (
          <>
            <input type="text" placeholder="Send a message..." />
            <button>Send</button>
          </>
        );
      }

      function ChatMessage(props) {
        const sender = props.sender;

        // if(sender === "robot") {
        //     return (
        //         <div>

        //             <img src={`${sender}.png`} alt={sender} width="40" />
        //             {props.message}
        //         </div>)
        // }
        return (
          <div>
            {sender === "robot" && (
              <img src="robot.png" alt="Robot" width="40" />
            )}

            {props.message}

            {sender === "user" && <img src="user.png" alt="User" width="40" />}
          </div>
        );
      }

      function App() {
        return (
          <div>
            {/*
                why do you think i can use this ChatInput component?
                because if you remember, we defined it as a function 
                and one function can call other functions
            */}

            <ChatInput />
            <ChatMessage message="Hello ChatBot" sender="user" />
            <ChatMessage message="Hello, How can i help you?" sender="robot" />
            <ChatMessage message="Can you get me todays's date?" sender="user" />
            <ChatMessage message="Todays is september 27" sender="robot" />
          </div>
        );
      }

      const container = document.querySelector(".js-container");
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
